services:
  # ==========================================
  # PERSISTENCIA REPLICADA: POSTGRESQL CLUSTER
  # ==========================================
  postgres-primary:
    build:
      context: ./postgres-cluster/primary
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 4s
      timeout: 3s
      retries: 10
    networks:
      - microservicios-net

  postgres-replica-1:
    build:
      context: ./postgres-cluster/replica
    container_name: postgres-replica-1
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5441:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - microservicios-net

  postgres-replica-2:
    build:
      context: ./postgres-cluster/replica
    container_name: postgres-replica-2
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5442:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - microservicios-net

  # ==========================================
  # DESCUBRIMIENTO DINÁMICO: EUREKA SERVER
  # ==========================================
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 25s
    networks:
      - microservicios-net

  # ==========================================
  # ENTRADA Y BALANCEO: SPRING CLOUD GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservicios-net

  # ==========================================
  # MICROSERVICIO 1: SERVICIO DE PRODUCTOS
  # ==========================================
  servicio-productos:
    build:
      context: ./servicio-productos
    container_name: servicio-productos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/productos_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-primary:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservicios-net

  # ==========================================
  # MICROSERVICIO 2 (INSTANCIA 1): PEDIDOS
  # ==========================================
  servicio-pedidos-1:
    build:
      context: ./servicio-pedidos
    container_name: servicio-pedidos-1
    environment:
      SERVER_PORT: 8081
      EUREKA_INSTANCE_INSTANCE_ID: servicio-pedidos-instancia-1
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      DB_PRIMARY_URL: jdbc:postgresql://postgres-primary:5432/pedidos_db
      DB_REPLICA1_URL: jdbc:postgresql://postgres-replica-1:5432/pedidos_db
      DB_REPLICA2_URL: jdbc:postgresql://postgres-replica-2:5432/pedidos_db
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_started
      postgres-replica-2:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - microservicios-net

  # ==========================================
  # MICROSERVICIO 2 (INSTANCIA 2): PEDIDOS
  # ==========================================
  servicio-pedidos-2:
    build:
      context: ./servicio-pedidos
    container_name: servicio-pedidos-2
    environment:
      SERVER_PORT: 8081
      EUREKA_INSTANCE_INSTANCE_ID: servicio-pedidos-instancia-2
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      DB_PRIMARY_URL: jdbc:postgresql://postgres-primary:5432/pedidos_db
      DB_REPLICA1_URL: jdbc:postgresql://postgres-replica-1:5432/pedidos_db
      DB_REPLICA2_URL: jdbc:postgresql://postgres-replica-2:5432/pedidos_db
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_started
      postgres-replica-2:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - microservicios-net

networks:
  microservicios-net:
    driver: bridge
