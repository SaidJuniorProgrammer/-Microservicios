server:
  port: 8081

spring:
  application:
    name: servicio-pedidos
  cloud:
    # Cache corta del balanceador para Feign: refleja altas/bajas de servicio-productos en ~2 s
    loadbalancer:
      cache:
        ttl: 2s
  jpa:
    # Sin Open-Session-In-View: cada transaccion obtiene su propia conexion, de modo que el
    # router elige nodo por transaccion y un reintento de lectura usa una conexion nueva.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  datasource:
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_password}
    primary:
      url: ${DB_PRIMARY_URL:jdbc:postgresql://postgres-primary:5432/pedidos_db}
    replica1:
      url: ${DB_REPLICA1_URL:jdbc:postgresql://postgres-replica-1:5432/pedidos_db}
    replica2:
      url: ${DB_REPLICA2_URL:jdbc:postgresql://postgres-replica-2:5432/pedidos_db}

eureka:
  instance:
    instance-id: ${EUREKA_INSTANCE_INSTANCE_ID:${spring.application.name}:${random.value}}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 5
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    # Por defecto el cliente refresca el registro cada 30 s
    registry-fetch-interval-seconds: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
