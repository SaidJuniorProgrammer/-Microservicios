listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
archive_mode = on
archive_command = 'test ! -f /tmp/wal_archive/%f && cp %p /tmp/wal_archive/%f || true'
wal_keep_size = 64MB
logging_collector = on
log_statement = 'all'
log_destination = 'stderr'
